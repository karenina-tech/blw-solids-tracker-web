version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One weekly PR for all safe (minor + patch) updates.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Major versions arrive as separate PRs so breaking changes get their own review.

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
